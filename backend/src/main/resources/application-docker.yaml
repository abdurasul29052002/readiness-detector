ai-server:
  url: ${AI_SERVER_URL:http://ai-predicter:8000}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/detectiondb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}

jwt:
  secret: ${JWT_SECRET:bXktZGV2LXNlY3JldC1rZXktdGhhdC1pcy1hdC1sZWFzdC0zMi1ieXRlcy1sb25nLWZvci1obWFjLXNoYTI1Ng==}
  expiration: ${JWT_EXPIRATION:86400000}
