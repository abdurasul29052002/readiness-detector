services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  ai-predicter:
    build: ./ai-predicter
    env_file:
      - ./ai-predicter/.env
    ports:
      - "8000:8000"
    volumes:
      - ./ai-predicter/models:/app/models
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        - PRODUCTION=true
    env_file:
      - .env
      - ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      - ai-predicter
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
